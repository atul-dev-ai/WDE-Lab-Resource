<!-- About form -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form | Atul Paul</title>
</head>

<body>

  <form action="#" method="get">
    Enter your name: <br>
    <input type="text" name="username" id=""><br>
    Enter your address: <br>
    <textarea name="" id="" cols="30" rows="10"></textarea> <br><br>
    <hr><br>

    <label for="FirstName">First Name:</label>
    <input type="text" name="FirstName" id="FirstName" placeholder="Enter your First Name"> <br> <br>
    <label for="LastName">Last Name:</label>
    <input type="text" name="LastName" id="LastName" placeholder="Enter your Last Name"> <br>
    <br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" id="male" value="male">Male
    <input type="radio" name="gender" id="female" value="female">Female <br>
    <br><br>
    <fieldset>
      <legend>Hobby:</legend>
      <input type="checkbox" name="cricket" id="cricket">
      <label for="cricket">Cricket</label>
      <input type="checkbox" name="football" id="football">
      <label for="football">Football</label>
      <input type="checkbox" name="hockey" id="hockey">
      <label for="hockey">Hockey</label> <br><br>

      <input type="submit" value="Log In"> <br><br>
    </fieldset><br><br>

    <fieldset>
      <br>
      <legend>User Information:</legend>
      <label for="name">Enter Your name:</label>
      <input type="text" name="name" id="name" placeholder="Enter Your Name"> <br><br>
      <label for="pw">Enter Password:</label>
      <input type="password" name="pw" id="pw" placeholder="Enter your Secret Pass"> <br>
      <input type="submit" value="Submit"> <br>
    </fieldset><br><br>
  </form>


</body>
</html>
